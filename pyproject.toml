[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smbex"
version = "0.1.0"
description = "Terminal explorer for remote hosts over SMB and SSH/SFTP, with ranger-style navigation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "impacket>=0.11",
    "paramiko>=3.0",
    "textual>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyftpdlib>=1.5",  # in-process FTP server for the FTP integration tests only
]
# Offline-translation runtime: CTranslate2 (inference) + SentencePiece (tokeniser)
# drive an Argos-format model directly (~65 MB) — deliberately NOT `argostranslate`,
# whose stanza->torch pull is ~5 GB of unused CUDA. See CLAUDE.md → Install.
#   pip install -e ".[translate]"     # then: python -m smbex --install-lang ja
translate = [
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
]

[project.scripts]
smbex = "smbex.cli:main"

[tool.setuptools.packages.find]
include = ["smbex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: stands up a real local server (may bind a port); skipped if it cannot",
]

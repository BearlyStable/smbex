name: Publish to PyPI

# Tag-triggered release. Bump smbex/__init__.py __version__ (the package version is
# read from it), then: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi            # must match the "Environment name" in PyPI's publisher
    permissions:
      id-token: write            # mint the OIDC token for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (OIDC — no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
